<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>医疗客服智能体 DEMO</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --user: #2563eb;
      --bot: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #243044;
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header p { margin: 0.35rem 0 0; font-size: 0.85rem; color: var(--muted); }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .msg { margin-bottom: 0.75rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .msg .bubble {
      max-width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble { background: var(--user); color: #fff; }
    .msg.bot .bubble { background: var(--bot); color: var(--text); }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    #bar {
      padding: 0.75rem 1rem 1.25rem;
      border-top: 1px solid #243044;
      background: var(--panel);
    }
    #form {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    textarea {
      flex: 1 1 200px;
      min-height: 44px;
      max-height: 120px;
      resize: vertical;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font: inherit;
    }
    button {
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; }
    #trace {
      max-width: 720px;
      margin: 0.5rem auto 0;
      font-size: 0.72rem;
      color: var(--muted);
      max-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      display: none;
    }
    #trace.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>医疗客服智能体 · 本地 DEMO</h1>
    <p>示例数据：订单 ORD2025001 / 手机后四位 1234；关键词可试「空腹」「报告」。</p>
  </header>
  <div id="log"></div>
  <pre id="trace"></pre>
  <div id="bar">
    <form id="form">
      <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="2"></textarea>
      <button type="submit" id="send">发送</button>
      <label><input type="checkbox" id="debug" /> 显示调试 trace</label>
    </form>
  </div>
  <script>
    const logEl = document.getElementById("log");
    const traceEl = document.getElementById("trace");
    const input = document.getElementById("input");
    const form = document.getElementById("form");
    const debugCb = document.getElementById("debug");

    let sessionId = localStorage.getItem("demo_session_id") || "";

    function append(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (role === "user" ? "user" : "bot");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      logEl.appendChild(wrap);
      logEl.scrollTop = logEl.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const btn = document.getElementById("send");
      btn.disabled = true;
      append("user", text);
      input.value = "";
      traceEl.classList.remove("show");
      traceEl.textContent = "";

      try {
        const body = { message: text, debug: debugCb.checked };
        if (sessionId) body.session_id = sessionId;
        const headers = { "Content-Type": "application/json" };
        const chatTok = localStorage.getItem("chat_api_token");
        if (chatTok) headers["X-Chat-Token"] = chatTok;
        const r = await fetch("/chat", {
          method: "POST",
          headers,
          body: JSON.stringify(body),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || r.statusText);
        sessionId = data.session_id;
        localStorage.setItem("demo_session_id", sessionId);
        append("bot", data.reply);
        if (data.debug_trace && debugCb.checked) {
          traceEl.textContent = JSON.stringify(data.debug_trace, null, 2);
          traceEl.classList.add("show");
        }
      } catch (err) {
        append("bot", "请求失败：" + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    append("bot", "你好，我是演示智能体。你可以问体检流程，或说「查订单 ORD2025001」。");
  </script>
</body>
</html>
